# docker-compose para desenvolvimento local e referência do EasyPanel.
# No EasyPanel, o Postgres já existe: aponte DATABASE_URL para ele e não suba o serviço "db".
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phish
      POSTGRES_PASSWORD: phish
      POSTGRES_DB: phishing
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phish -d phishing']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3333
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://phish:phish@db:5432/phishing?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-troque-me-000000}
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-troque-me-00000}
      JWT_REFRESH_TTL: 604800
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@rstechsolutions.com.br}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-ChangeMe123!}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Administrador}
    ports:
      - '3333:3333'

volumes:
  pgdata:
  redisdata:
